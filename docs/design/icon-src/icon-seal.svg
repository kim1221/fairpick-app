    <text x="300" y="525" fill="#B8924A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="7" text-anchor="middle">CULTURE CARD</text>
