<svg xmlns="http://www.w3.org/2000/svg" width="1080px" height="1080px" viewBox="0 0 1080 1080" role="img" aria-label="컬처카드 브론즈 씰 썸네일">
  <defs>
    <radialGradient id="inkGlow" cx="50%" cy="34%" r="76%">
      <stop offset="0%" stop-color="#24242A"/>
      <stop offset="58%" stop-color="#16161A"/>
      <stop offset="100%" stop-color="#101014"/>
    </radialGradient>
    <radialGradient id="bronzeSeal" cx="36%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#D2B36E"/>
      <stop offset="38%" stop-color="#B8924A"/>
      <stop offset="100%" stop-color="#9C7635"/>
    </radialGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#inkGlow)"/>
