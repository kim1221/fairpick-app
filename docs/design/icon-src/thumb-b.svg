    <circle cx="540" cy="420" r="260" fill="url(#bronzeSeal)" stroke="#B8924A" stroke-width="12"/>
    <circle cx="540" cy="420" r="212" fill="none" stroke="#F5F1E8" stroke-width="6" stroke-linecap="round" stroke-dasharray="3 20" opacity="0.72"/>
    <circle cx="540" cy="420" r="170" fill="#16161A" opacity="0.10"/>
    <text x="540" y="412" fill="#F5F1E8" font-family="'Noto Serif KR', serif" font-size="172" font-weight="700" text-anchor="middle" dominant-baseline="middle">文化</text>
  </g>
  <text x="540" y="802" fill="#F5F1E8" font-family="'Noto Serif KR', serif" font-size="124" font-weight="700" text-anchor="middle">컬처카드</text>
  <line x1="360" y1="856" x2="720" y2="856" stroke="#B8924A" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 20"/>
</svg>
