<svg xmlns="http://www.w3.org/2000/svg" width="600px" height="600px" viewBox="0 0 600 600" role="img" aria-label="컬처카드 갤러리 티켓 앱 아이콘">
  <defs>
    <radialGradient id="inkGlow" cx="50%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#24242A"/>
      <stop offset="62%" stop-color="#16161A"/>
      <stop offset="100%" stop-color="#101014"/>
    </radialGradient>
    <filter id="ticketShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <mask id="ticketMask">
      <rect x="116" y="172" width="368" height="256" rx="34" fill="white"/>
      <circle cx="116" cy="300" r="38" fill="black"/>
      <circle cx="484" cy="300" r="38" fill="black"/>
    </mask>
  </defs>
  <rect width="600" height="600" fill="url(#inkGlow)"/>
  <g transform="rotate(-6 300 300)" filter="url(#ticketShadow)">
    <g mask="url(#ticketMask)">
      <rect x="116" y="172" width="368" height="256" rx="34" fill="#F5F1E8"/>
      <rect x="128" y="184" width="344" height="232" rx="26" fill="none" stroke="#B8924A" stroke-width="5" opacity="0.82"/>
      <line x1="152" y1="300" x2="448" y2="300" stroke="#9C7635" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 16"/>
    </g>
    <text x="300" y="256" fill="#16161A" font-family="'Noto Serif KR', serif" font-size="88" font-weight="700" text-anchor="middle" dominant-baseline="middle">文化</text>
    <text x="300" y="368" fill="#B8924A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800" letter-spacing="6" text-anchor="middle">ADMIT ONE</text>
  </g>
</svg>
