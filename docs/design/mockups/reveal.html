<!-- @dsCard group="컬처카드 · 갤러리티켓" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>컬처카드 — 카드 열림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161A;--ink-line:#2C2C33;--paper:#F5F1E8;--paper-edge:#E7E0D2;
--text:#1A1A1E;--muted:#6B6760;--on-ink:#F2EEE5;--on-ink-mut:#9A968E;
--blue:#3182F6;--bronze:#B8924A;--bronze-d:#947231;--perform:#A8324A;
--serif:'Gowun Batang','Nanum Myeongjo',serif;
--sans:'Pretendard',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#0E0E11;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--sans);padding:24px}
.phone{width:390px;height:844px;background:var(--ink);border-radius:46px;position:relative;overflow:hidden;
box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 1px #2a2a30;
background-image:radial-gradient(120% 80% at 50% -10%,#232329 0%,var(--ink) 55%)}
.statusbar{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;color:var(--on-ink);font-size:14px;font-weight:600}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:6px 22px 10px}
.nav-x{color:var(--on-ink-mut);font-size:22px;font-weight:400}
.nav-t{color:var(--on-ink);font-weight:700;font-size:15px}
.toast{margin:4px 22px 0;background:rgba(184,146,74,.14);border:1px solid rgba(184,146,74,.35);
border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:10px;color:#E8D9B6}
.toast .b{width:30px;height:30px;border-radius:9px;background:var(--bronze);color:#1A1A1E;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.toast b{color:#F2EEE5}
.content{padding:16px 22px 0}
.ticket{background:var(--paper);border-radius:22px;position:relative;box-shadow:0 22px 50px rgba(0,0,0,.5);overflow:hidden}
.ticket::before{content:"";position:absolute;inset:0;border-radius:22px;box-shadow:inset 0 0 0 1px var(--paper-edge);pointer-events:none}
.thumb{height:188px;position:relative;overflow:hidden;
background:radial-gradient(120% 90% at 20% 10%,#2b4a8f,#16223f 70%),linear-gradient(135deg,#3a5fa8,#101a30)}
.thumb .rays{position:absolute;inset:0;background:
conic-gradient(from 200deg at 70% 30%,rgba(255,214,138,.45),transparent 25%,rgba(120,170,255,.35) 55%,transparent 80%);mix-blend-mode:screen;opacity:.8}
.thumb .gloss{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 55%)}
.cat{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.4px;padding:5px 11px;border-radius:999px;background:rgba(20,25,45,.6);color:#cfe0ff;backdrop-filter:blur(6px)}
.dday{position:absolute;top:14px;right:14px;font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:8px;background:#FBE7E7;color:#C0392B}
.body{padding:18px 20px 0}
.title{font-family:var(--serif);color:var(--text);font-weight:700;font-size:21px;letter-spacing:-.4px;line-height:1.3}
.meta{color:var(--muted);font-size:13px;margin-top:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dot{width:3px;height:3px;border-radius:50%;background:#c3bba8}
.blurb{color:#54504a;font-size:13px;line-height:1.6;margin-top:12px}
.perf{position:relative;height:0;border-top:2px dashed #cfc6b2;margin:18px 18px 0}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;background:var(--ink);border-radius:50%}
.perf::before{left:-31px}.perf::after{right:-31px}
.stub{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 18px}
.admit{font-size:10.5px;letter-spacing:2.5px;font-weight:800;color:var(--bronze-d)}
.stub .earn{font-size:13px;font-weight:800;color:var(--text)}
.stub .earn b{color:var(--bronze-d)}
.actions{display:flex;gap:10px;margin:18px 22px 0}
.btn{height:50px;border-radius:14px;border:0;font-family:var(--sans);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:var(--blue);color:#fff;flex:1.4;box-shadow:0 8px 18px rgba(49,130,246,.3)}
.btn.dark{background:#26262C;color:var(--on-ink);border:1px solid var(--ink-line);flex:1}
.next{display:flex;justify-content:center;margin-top:18px}
.next a{color:var(--on-ink-mut);font-size:13.5px;font-weight:700}
.home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
</style></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>● ● ● &nbsp; ▮▮</span></div>
  <div class="navbar"><div class="nav-x">✕</div><div class="nav-t">카드 열림</div><div style="width:22px"></div></div>

  <div class="toast"><div class="b">🎟</div><div>티켓 <b>2장</b>을 모았어요 · 오늘 14/30</div></div>

  <div class="content">
    <div class="ticket">
      <div class="thumb"><div class="rays"></div><div class="gloss"></div>
        <span class="cat">● 전시</span><span class="dday">D-28</span>
      </div>
      <div class="body">
        <div class="title">빛의 정원: 모네에서 클림트까지</div>
        <div class="meta">디뮤지엄 · 한남<span class="dot"></span>5/1 – 7/28<span class="dot"></span>도보 12분</div>
        <div class="blurb">인상주의부터 빈 분리파까지, 빛을 다룬 거장들의 원화를 한자리에서 만나요.</div>
      </div>
      <div class="perf"></div>
      <div class="stub"><div class="admit">ADMIT ONE</div><div class="earn">적립 <b>+2 티켓</b></div></div>
    </div>

    <div class="actions">
      <button class="btn primary">길찾기</button>
      <button class="btn dark">♡ 저장</button>
      <button class="btn dark">↗ 공유</button>
    </div>
    <div class="next"><a>다음 카드 열기 ›</a></div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
